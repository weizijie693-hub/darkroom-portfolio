<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗房工作室 · App 图标生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:40px}
h1{font-weight:300;letter-spacing:.2em;font-size:16px;color:#aaa}
.canvases{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.canvases div{text-align:center}
canvas{border:1px solid rgba(255,255,255,.1)}
p{font-size:11px;color:#666;margin-top:6px}
.info{font-size:12px;color:#666;text-align:center;max-width:500px;line-height:1.8}
.info code{color:#c4a265;background:#1a1a1a;padding:1px 6px;font-size:11px}
</style></head>
<body>
<h1>DARKROOM STUDIO · App Icons</h1>
<div class="canvases">
  <div><canvas id="c192"></canvas><p>icon-192.png</p></div>
  <div><canvas id="c512"></canvas><p>icon-512.png</p></div>
</div>
<p class="info">图标会自动下载到默认下载目录<br>将它们移动到项目 <code>icons/</code> 文件夹即可</p>
<script>
function drawIcon(canvasId, size, cb) {
  var c = document.getElementById(canvasId);
  c.width = size; c.height = size;

  var ctx = c.getContext('2d');
  var W = size, H = size;
  var dpr = 1;
  c.width = W * dpr; c.height = H * dpr;
  ctx.scale(dpr, dpr);

  // Darkroom black background
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Subtle radial glow
  var glow = ctx.createRadialGradient(W*0.4, H*0.35, 0, W*0.5, H*0.5, W*0.7);
  glow.addColorStop(0, '#1a1816');
  glow.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Film sprocket holes
  ctx.fillStyle = '#1a1a1a';
  var holeGap = W * 0.06;
  for (var x = holeGap; x < W; x += holeGap) {
    var hs = W * 0.014;
    ctx.fillRect(x, W * 0.025, hs, W * 0.025);
    ctx.fillRect(x, H - W * 0.05, hs, W * 0.025);
  }

  // Center lettering: "暗"
  ctx.fillStyle = '#e0d8c8';
  ctx.font = '200 ' + (W * 0.38) + 'px "Noto Serif SC", "Songti SC", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('暗', W / 2, H * 0.44);

  // "DARKROOM" below
  ctx.fillStyle = '#8a8070';
  ctx.font = '300 ' + (W * 0.06) + 'px "Inter", sans-serif';
  ctx.letterSpacing = '0.3em';
  ctx.fillText('DARKROOM', W / 2, H * 0.72);

  // Corner accents
  var m = W * 0.1; var cl = W * 0.06;
  ctx.strokeStyle = 'rgba(200,180,140,0.25)'; ctx.lineWidth = 1;
  // TL
  ctx.beginPath(); ctx.moveTo(m, m + cl); ctx.lineTo(m, m); ctx.lineTo(m + cl, m); ctx.stroke();
  // TR
  ctx.beginPath(); ctx.moveTo(W - m - cl, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + cl); ctx.stroke();
  // BL
  ctx.beginPath(); ctx.moveTo(m, H - m - cl); ctx.lineTo(m, H - m); ctx.lineTo(m + cl, H - m); ctx.stroke();
  // BR
  ctx.beginPath(); ctx.moveTo(W - m - cl, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - cl); ctx.stroke();

  // Download
  try {
    var url = c.toDataURL('image/png');
    var a = document.createElement('a');
    a.href = url; a.download = 'icon-' + size + '.png'; a.style.display = 'none';
    document.body.appendChild(a);
    setTimeout(function(){ a.click(); document.body.removeChild(a); }, 600 + (size===192?0:300));
  } catch(e) { console.error(e); }
}

drawIcon('c192', 192);
drawIcon('c512', 512);
</script>
</body>
</html>
